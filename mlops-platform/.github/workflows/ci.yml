name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  quality:
    name: Lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Code quality (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit + integration tests (pytest)
        run: pytest --cov=mlops_platform --cov-report=term-missing

      - name: End-to-end smoke test (data -> train -> registry)
        run: |
          python -m mlops_platform.cli prepare-data
          python -m mlops_platform.cli train

  docker:
    name: Build image Docker
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (avec cache GitHub Actions)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mlops-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test de l'image
        run: docker run --rm mlops-platform:ci python -c "import mlops_platform, mlflow, fastapi; print('image OK')"

      - name: Login GHCR (branche main uniquement)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push de l'image (branche main uniquement)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
