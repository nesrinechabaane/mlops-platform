name: Surveillance & réentraînement

# Démontre la boucle complète : données de production (simulées) -> détection de dérive
# -> alerte -> réentraînement -> nouvelle version dans le Model Registry.
# En production réelle, `monitor` tournerait sur les logs de l'API (cron, Airflow, etc.).

on:
  workflow_dispatch:
    inputs:
      drift:
        description: "Simuler une dérive des données ?"
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # chaque lundi, 06:00 UTC

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt

      - name: Entraînement initial
        run: |
          python -m mlops_platform.cli prepare-data
          python -m mlops_platform.cli train

      - name: Simulation de données de production
        run: |
          if [ "${{ github.event.inputs.drift || 'true' }}" = "true" ]; then
            python -m mlops_platform.cli simulate-drift
          else
            python -m mlops_platform.cli simulate-drift --no-drift
          fi

      - name: Détection de dérive + réentraînement si besoin
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: python -m mlops_platform.cli monitor --current data/production/current.csv --retrain

      - name: Publier les rapports
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: reports/
